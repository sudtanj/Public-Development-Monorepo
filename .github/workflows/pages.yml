name: Deploy showcase

on:
  push:
    branches: [main]
    paths: ['arduino-*/**', 'move-*/**', 'thunkable/**', 'appinventor-*/**', 'site/**', 'tour-aggregator/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/configure-pages@v5

      - name: Build sketches and assemble site
        run: |
          mkdir -p _site/projects
          cp -r site/. _site/
          for f in thunkable/*.aia appinventor-*/*.aia; do mkdir -p "_site/aia/$(dirname "$f")"; cp "$f" "_site/aia/$f"; done
          # cache-bust assets so HTML, JS and CSS always match
          find _site -name "*.html" -exec sed -i "s#\\(player\\|app\\)\\.js\"#\\1.js?v=$GITHUB_SHA\"#; s#style\\.css\"#style.css?v=$GITHUB_SHA\"#" {} +
          list=()
          for d in arduino-*/; do
            d=${d%/}
            [ -f "$d/wokwi.toml" ] || continue
            ./"$d"/build.sh
            mkdir -p "_site/projects/$d"
            cp "$d/build/sketch.ino.hex" "_site/projects/$d/sketch.hex"
            cp "$d/diagram.json" "_site/projects/$d/"
            list+=("$d")
          done
          printf '%s\n' "${list[@]}" | jq -R . | jq -sc . > _site/projects.json
          cat _site/projects.json

      - name: Test the tour scraper
        run: node --test tour-aggregator/*.test.mjs

      # A scraper failure must not block unrelated deploys: keep the last published tour list instead.
      - name: Scrape tours
        run: |
          node tour-aggregator/scrape.mjs _site/tours/tours.json ||
            wget -q -T 30 -O _site/tours/tours.json https://sudtanj.github.io/Public-Development-Monorepo/tours/tours.json ||
            rm -f _site/tours/tours.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
